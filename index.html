<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rắn 3D">
<meta name="theme-color" content="#1c1c1a">
<link rel="manifest" href="manifest.json">
<title>Rắn 3D</title>
<style>
body{margin:0;background:#1c1c1a;color:#fff;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 16px) 12px 24px;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.stat{background:#2c2c2a;border-radius:10px;padding:8px 12px}
.stat small{color:#b4b2a9;font-size:13px}
.stat div{font-size:22px;font-weight:600}
#wrap{position:relative;width:100%;max-width:420px;aspect-ratio:1;touch-action:none}
#wrap canvas{display:block;width:100%;height:100%;border-radius:12px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.45);border-radius:12px;z-index:2}
#msg{font-size:17px;font-weight:600;text-align:center;padding:0 16px;line-height:1.5}
#lvb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7);opacity:0;transform:scale(.8);transition:all .3s;pointer-events:none;z-index:1}
button{font-size:22px;border:0;border-radius:10px;background:#3a3a37;color:#fff;touch-action:manipulation}
button:active{background:#55554f}
#st{font-size:17px;padding:10px 26px;background:#1D9E75}
#mu{font-size:20px;background:#2c2c2a}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px}
</style>
</head>
<body>
<div class="stats">
  <div class="stat"><small>Điểm</small><div id="sc">0</div></div>
  <div class="stat"><small>Kỷ lục</small><div id="bs">0</div></div>
  <div class="stat"><small>Màn</small><div id="lv">1</div></div>
</div>
<div id="wrap">
  <div id="lvb"></div>
  <div id="ov">
    <div id="msg">Ăn táo để dài ra, né những tảng đá.<br>Táo vàng được +3 điểm!</div>
    <button id="st">Bắt đầu</button>
  </div>
</div>
<div class="pad">
  <span></span><button data-d="0,-1">▲</button><button id="mu">🔊</button>
  <button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button>
</div>
<script>
(function(){const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');
for(let x=0;x<6;x++)for(let y=0;y<6;y++){g.fillStyle=(x+y)%2?'#9BCB5E':'#8BBE4E';g.fillRect(x*30,y*30,30,30)}
const dot=(x,y,r,col)=>{g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()};
[[30,135],[60,135],[90,135],[90,105],[90,75]].forEach((p,i)=>dot(p[0],p[1],15,i%2?'#168a66':'#1D9E75'));
dot(122,75,19,'#0F6E56');dot(130,66,6,'#fff');dot(130,84,6,'#fff');dot(132,66,3,'#111');dot(132,84,3,'#111');
dot(145,140,17,'#E24B4A');g.fillStyle='#639922';g.beginPath();g.ellipse(152,120,8,4,-0.5,0,Math.PI*2);g.fill();
const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
